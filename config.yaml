# Analysis thresholds — adjust to your musical context
pitch:
  tolerance_cents: 20          # ±20 cents = acceptable tuning
  stability_threshold: 15      # maximum acceptable standard deviation (cents)

rhythm:
  onset_deviation_ms: 30       # maximum acceptable deviation per onset
  tempo_variance_bpm: 5        # tolerable tempo variation

dynamics:
  min_dynamic_range_db: 10     # minimum desired dynamic range
  clipping_threshold_db: -1    # threshold for clipping detection

quality:
  min_snr_db: 20               # minimum acceptable SNR for the recording

report:
  language: en                 # language for recommendations
  output_dir: docs/reports/
